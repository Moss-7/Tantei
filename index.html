<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たんていミミと ひみつの たからもの</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<div id="app">
  <section id="title" class="scene">
    <canvas id="titleBg" class="title-bg" aria-hidden="true"></canvas><canvas id="titleClouds" class="title-bg" aria-hidden="true"></canvas>
    <div class="title-inner">
      <h1>たんていミミと<br>ひみつの たからもの</h1>
      <canvas id="titleArt" width="640" height="240" aria-hidden="true"></canvas>
      <p class="pick">あそぶ ひとの マークを えらんでね</p>
      <div id="slots" class="slots"></div>
    </div>
  </section>

  <section id="game" class="scene" hidden>
    <div class="hud">
      <button id="btnHome" class="sys" type="button" aria-label="タイトルに もどる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6.5 10v9h11v-9M10.5 19v-5h3v5"/></svg>
      </button>
      <canvas id="who" class="who-icon" width="72" height="72" role="img"></canvas>
      <b id="stageName">1話 おうちと にわ</b>
      <button id="btnSound" class="sys" type="button" aria-label="おと" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z"/><path class="on" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/><path class="off" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>
      </button>
    </div>
    <div class="play">
      <div class="pad" aria-label="いどう">
        <button type="button" data-dir="up" aria-label="うえ">▲</button>
        <button type="button" data-dir="left" aria-label="ひだり">◀</button>
        <button type="button" data-dir="right" aria-label="みぎ">▶</button>
        <button type="button" data-dir="down" aria-label="した">▼</button>
      </div>
      <div class="field" id="field"><canvas id="bg" aria-hidden="true"></canvas><canvas id="clouds" aria-hidden="true"></canvas><canvas id="cv" aria-label="にわの マップ"></canvas><span class="keys" id="keys" aria-label="カギ"></span></div>
      <div class="talk">
        <canvas id="catface" width="120" height="120" aria-hidden="true"></canvas>
        <div id="sayPic" class="say-box" hidden></div>
        <p id="say" aria-live="polite"></p>
      </div>
      <div class="act">
        <button id="btnNote" class="cmd note-btn" type="button">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="4" width="20" height="25" rx="3" fill="#FFF8E1" stroke="#3A2D58" stroke-width="2.4"/><path d="M12 11h10M12 16h10M12 21h6" stroke="#3A2D58" stroke-width="2.2" stroke-linecap="round"/><path d="M4 9h6M4 14h6M4 19h6M4 24h6" stroke="#D9478A" stroke-width="2.6" stroke-linecap="round"/></svg>
          <span>てちょう</span>
        </button>
        <button id="btnDig" class="cmd dig" type="button" hidden>
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="13" r="8.5" fill="#DDF4FF" stroke="#3A2D58" stroke-width="3"/><path d="M19.5 19.5L28 28" stroke="#3A2D58" stroke-width="4" stroke-linecap="round"/></svg>
          <span>さがす</span>
        </button>
      </div>
    </div>
  </section>

  <button id="gate" class="gate" type="button" aria-label="むしめがねを タッチして はじめる">
    <span class="lens" id="lens"><canvas id="lensArt" width="240" height="240" aria-hidden="true"></canvas></span>
    <span class="gate-say">むしめがねを タッチして<br>のぞいてみよう</span>
  </button>

  <div id="modal" class="modal" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
</div>
<!--/APP-->
<script src="game.js"></script>
</body>
</html>
